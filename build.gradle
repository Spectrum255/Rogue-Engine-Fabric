plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	maven {
		name = 'Terraformers'
		url = uri('https://maven.terraformersmc.com/releases')
	}
}

loom {
	splitEnvironmentSourceSets()
	mods {
		"rogue-engine-fabric" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "org.apache.commons:commons-compress:1.28.0"
	include "org.apache.commons:commons-compress:1.28.0"
	clientCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	clientRuntimeOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

	testImplementation platform('org.junit:junit-bom:5.12.2')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
}

def serverRunDirectory = project.findProperty('rogueRunDir') ?: layout.buildDirectory.dir('server-smoke').get().asFile

tasks.named('runServer') {
	workingDir = serverRunDirectory
	jvmArgs "-Duser.dir=${serverRunDirectory}"
}

def clientRunDirectory = project.findProperty('rogueClientDir') ?: layout.buildDirectory.dir('client-smoke').get().asFile

tasks.named('runClient') {
	workingDir = clientRunDirectory
	jvmArgs "-Duser.dir=${clientRunDirectory}"
	if (project.hasProperty('rogueAcceptanceWorldDir')) {
		jvmArgs "-Drogue.acceptance.worldDir=${project.property('rogueAcceptanceWorldDir')}"
	}
	if (project.hasProperty('rogueAcceptanceResult')) {
		jvmArgs "-Drogue.acceptance.result=${project.property('rogueAcceptanceResult')}"
	}
	if (project.hasProperty('rogueAcceptanceServer')) {
		jvmArgs "-Drogue.acceptance.server=${project.property('rogueAcceptanceServer')}"
	}
}

def modVersion = project.version

processResources {
	inputs.property "version", modVersion

	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
